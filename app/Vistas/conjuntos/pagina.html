{{{encabezado}}}

<section>
    <form method="post" action="index.php?app=conjuntos">
        <div class="campo">
            <label for="conjunto_a">Conjunto A</label>
            <input type="text" id="conjunto_a" name="conjunto_a" autocomplete="off" required value="{{textoA}}">
        </div>
        <div class="campo">
            <label for="conjunto_b">Conjunto B</label>
            <input type="text" id="conjunto_b" name="conjunto_b" autocomplete="off" required value="{{textoB}}">
            <small>Números enteros separados por espacios o comas.</small>
        </div>
        <button class="boton" type="submit">Calcular</button>
    </form>
{{{resultado}}}
</section>
