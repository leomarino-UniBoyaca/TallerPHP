{{{encabezado}}}

<section>
    <form method="post" action="index.php?app=series">
        <div class="campo">
            <label for="numero">Número</label>
            <input type="number" id="numero" name="numero" min="0" max="{{limite}}" step="1" required value="{{numero}}">
            <small>Valor entero entre 0 y {{limite}}.</small>
        </div>
        <div class="campo">
            <label for="operacion">Operación</label>
            <select id="operacion" name="operacion">
{{{opciones}}}            </select>
        </div>
        <button class="boton" type="submit">Calcular</button>
    </form>
{{{resultado}}}
</section>
